name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test --configuration Release --no-build /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:CoverletOutput=./TestResults/coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/TestResults/coverage/**'

  openspec-validate:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attempt OpenSpec validation (best-effort)
        shell: bash
        run: |
          if command -v openspec >/dev/null 2>&1; then
            echo "Running openspec validation in strict mode"
            # Validate entire repo specs; intended to be strict for proposal/spec PRs
            openspec validate --strict || exit 1
          else
            echo "openspec CLI not found; skipping validation."
          fi
